# Flujo incremental de los estudios (/estudios) y de las capas de estudios en /mapas.
#
# Cada [pasos.<nombre>] declara qué script corre, qué archivos lee (entradas) y cuáles escribe (salidas).
# scripts/flujo.py arma el grafo con estas declaraciones (un paso depende de otro si lee algo que el otro escribe),
# detecta qué entradas cambiaron (por contenido, con un hash) y rehace, en orden, solo lo afectado.
#
#   .venv/bin/python -I scripts/flujo.py --seco            qué se rehace y por qué (no ejecuta nada)
#   .venv/bin/python -I scripts/flujo.py                   rehace lo afectado (salta los pasos pesados y los de red)
#   .venv/bin/python -I scripts/flujo.py --cambio RUTA     simula que RUTA cambió (con --seco: «¿qué se rehace si…?»)
#   .venv/bin/python -I scripts/flujo.py --marcar          da por buenas las salidas actuales (primera vez o tras rehacer a mano)
#   .venv/bin/python -I scripts/flujo.py --grafo           dibuja el grafo (Mermaid)
#
# Rutas relativas a geodatos/. «../clima/…» es la carpeta de clima (solo lectura). Se admiten comodines (*, **).
# «@grupo» se sustituye por la lista de [grupos]. El propio script del paso cuenta siempre como entrada.
# Claves de un paso:
#   script   archivo en scripts/ (se usa para el comando por omisión y como entrada)
#   cmd      lista de comandos (se corren desde geodatos/ con sh); {py} = .venv/bin/python -I. Por omisión: «{py} scripts/<script>»
#   codigo   otros scripts que el paso importa (cuentan como entradas)
#   pesado   true = corrida larga (modelo 2D, ANUGA): solo corre con --pesados o si se nombra con --solo/--forzar
#   red      true = baja datos de internet: solo corre con --red (y entonces corre siempre)
#   manual   true = nunca corre sola, solo con --forzar <paso>
#   siempre  true = corre en cada ejecución que no sea --seco (controles)
#   nota     una línea para la persona que lee el plan
#
# Si añades un script nuevo: declara aquí sus entradas y salidas y corre «flujo.py --seco» para ver dónde queda.

[grupos]
ierse = ["../clima/datos/ierse-wsn/serie_5min.csv.gz", "../clima/datos/ierse-wsn/diario.csv",
         "../clima/datos/ierse-wsn/horario.csv", "../clima/datos/ierse-wsn/estaciones.geojson",
         "../clima/datos/ierse-wsn/estaciones.json"]
dem_sc = ["descargas/dem_recortes/santa_cruz_dem.tif", "descargas/dem_recortes/santa_cruz_dem_quemado.tif"]
dem_scb = ["descargas/dem_recortes/san_cristobal_dem.tif", "descargas/dem_recortes/san_cristobal_dem_quemado.tif"]
capas = ["capas/final/*.geojson", "capas/igm/*.geojson", "capas/osm/*.geojson", "capas/dem/*.geojson", "export/galapagos/*.geojson"]
lluvia_evento = ["estudios/la-cascada/datos/lluvia_ierse_30oct_5min.csv", "estudios/la-cascada/datos/lluvia_ierse_validacion_5min.csv"]

