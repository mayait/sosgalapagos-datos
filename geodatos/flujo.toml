# ------------------------------------------------------------------ Santa Cruz: modelo 2D
[pasos.modelo2d_santa_cruz]
script = "24_modelo2d_santa_cruz.py"
pesado = true
nota = "LISFLOOD-ACC: juegos (a) y (b) del 30-oct y validación del 3–4 oct (≈1–2 min por escenario)"
cmd = ["{py} -W ignore scripts/24_modelo2d_santa_cruz.py b_central --motor lisflood",
       "{py} -W ignore scripts/24_modelo2d_santa_cruz.py central --motor lisflood",
       "{py} -W ignore scripts/24_modelo2d_santa_cruz.py b_03oct --motor lisflood",
       "{py} -W ignore scripts/24_modelo2d_santa_cruz.py a_03oct --motor lisflood"]
entradas = ["@dem_sc", "capas/dem/cuencas_localidad.geojson", "capas/final/barrios.geojson", "capas/final/zonas_pobladas.geojson",
            "capas/igm/zona_urbana.geojson", "export/galapagos/zona_agricola.geojson", "estudios/la-cascada/datos/cuenca_cascada.geojson",
            "@lluvia_evento", "estudios/santa-cruz/datos/cruces.csv"]
salidas = ["estudios/santa-cruz/datos/modelo2d/b_central/resumen_b_central.json", "estudios/santa-cruz/datos/modelo2d/b_central/calado_max_clases.geojson",
           "estudios/santa-cruz/datos/modelo2d/b_central/series_puntos.csv", "estudios/santa-cruz/datos/modelo2d/b_central/calado_max_m.tif",
           "estudios/santa-cruz/datos/modelo2d/central/resumen_central.json", "estudios/santa-cruz/datos/modelo2d/b_03oct/resumen_b_03oct.json",
           "estudios/santa-cruz/datos/modelo2d/a_03oct/resumen_a_03oct.json"]

[pasos.modelo2d_santa_cruz_sensibilidad]
script = "24_modelo2d_santa_cruz.py"
pesado = true
nota = "Sensibilidad (lluvia, Manning, CN, 23-oct) de los juegos (a) y (b)"
cmd = ["for e in b_bajo b_alto b_manning_bajo b_manning_alto b_23oct bajo alto manning_bajo manning_alto cn68 a_23oct; do {py} -W ignore scripts/24_modelo2d_santa_cruz.py $e --motor lisflood || exit 1; done"]
entradas = ["@dem_sc", "capas/dem/cuencas_localidad.geojson", "capas/final/barrios.geojson", "capas/final/zonas_pobladas.geojson",
            "capas/igm/zona_urbana.geojson", "export/galapagos/zona_agricola.geojson", "estudios/la-cascada/datos/cuenca_cascada.geojson",
            "@lluvia_evento", "estudios/santa-cruz/datos/cruces.csv"]
salidas = ["estudios/santa-cruz/datos/modelo2d/b_bajo/resumen_b_bajo.json", "estudios/santa-cruz/datos/modelo2d/b_alto/resumen_b_alto.json",
           "estudios/santa-cruz/datos/modelo2d/cn68/resumen_cn68.json"]

[pasos.modelo2d_santa_cruz_anuga]
script = "24_modelo2d_santa_cruz.py"
pesado = true
manual = true
nota = "Contraste ANUGA del juego (b) desde las 17 h (≈13 min por hora simulada): solo a mano"
cmd = ["INICIO_H=17 {py} -W ignore scripts/24_modelo2d_santa_cruz.py b_central --motor anuga"]
entradas = ["@dem_sc", "estudios/la-cascada/datos/cuenca_cascada.geojson", "@lluvia_evento"]
