<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa de lluvia (demo)</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="lluvia-mapa.css">
<style>
  :root{--bg:#fff;--ink:#141414;--mut:#666}
  @media (prefers-color-scheme:dark){:root{--bg:#121212;--ink:#f2f2f2;--mut:#a0a0a0}}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif}
  main{max-width:1100px;margin:0 auto;padding:16px}
  h1{font-size:20px;margin:0 0 4px}
  p{color:var(--mut);font-size:14px;margin:0 0 12px;max-width:72ch}
</style>
</head>
<body>
<main>
  <h1>Mapa de lluvia de los modelos (demostración)</h1>
  <p>Prototipo del componente <code>lluvia-mapa.js</code> para el panel de <code>/clima/</code>. Usa una muestra real de Open-Meteo,
    guardada en <code>muestras/lluvia-mapa.json</code>: se ve la corrida de ese día, no la de hoy. Es lluvia de modelo, no un pronóstico oficial.</p>
  <div id="lluvia"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="lluvia-mapa.js"></script>
<script>
  // Arranca en el bloque de 3 h que contiene la hora actual; si la muestra ya es vieja, en su primer cuadro de pronóstico.
  LluviaMapa.montar(document.getElementById("lluvia"), {datos: "muestras/lluvia-mapa.json"}).then(c => { window.lluvia = c; });
</script>
</body>
</html>
